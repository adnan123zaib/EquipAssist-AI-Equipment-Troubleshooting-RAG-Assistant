services:
  - type: web
    name: equipassist-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && PYTHONPATH=. uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: equipassist-db
          property: connectionString
      - key: LLM_PROVIDER
        value: local
      - key: EMBEDDING_PROVIDER
        value: local
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CHROMA_PERSIST_DIRECTORY
        value: /tmp/equipassist/chroma
      - key: MANUAL_STORAGE_DIRECTORY
        value: /tmp/equipassist/manuals
  - type: web
    name: equipassist-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: equipassist-db
    plan: free
    databaseName: equipassist
    user: equipassist

